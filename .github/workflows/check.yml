name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The port: no port commentary, the MIT notice in every ported skill,
      # cube's skill rules, links and limits, the handoff and model rules,
      # and no retired name in any path or file (PORTING.md).
      - run: node scripts/check-port.mjs
      # Fixtures for the patterns the check uses, and whole-checker runs.
      - run: node --test scripts/check-port.test.mjs
